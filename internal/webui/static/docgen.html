<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档生成</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  body { padding: 0; }
  .kb-top { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line);
           background: var(--bg); position:sticky; top:0; z-index:5; }
  .kb-top h1 { font-size:16px; margin:0; }
  .kb-top .spacer { flex:1; }
  .kb-wrap { max-width:960px; margin:0 auto; padding:20px; }
  .kb-card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px; margin-top:10px; }
  .kb-card h3 { margin:0 0 4px; font-size:14px; }
  .kb-card .stat { font-size:12px; color:var(--muted); }
  .kb-card .ops { display:flex; gap:8px; margin-top:10px; }
  .kb-row { display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line); }
  .kb-row:last-child { border-bottom:none; }
  .kb-row .name { flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kb-row .meta { color:var(--muted); font-size:12px; }
  .chip { font-size:11px; padding:1px 7px; border-radius:999px; background:var(--surface-2); color:var(--muted); }
  .hint { color:var(--muted); font-size:12px; }
  #fileInput { display:none; }
</style>
</head>
<body><div class="app">
  <aside class="sidebar">
    <div class="logo">
      <span class="mark" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.26 6.6.57-5 4.4 1.53 6.52L12 16.9 5.97 19.75 7.5 13.23l-5-4.4 6.6-.57z"/></svg></span>
      <span class="txt">StarBurst</span>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">控制台</div>
      <button data-href="/" title="AI 工作台"><span class="txt">AI 工作台</span></button>
      <button data-href="/" title="任务"><span class="txt">任务</span></button>
      <button data-href="/" title="编排"><span class="txt">编排</span></button>
      <button data-href="/" title="实时流"><span class="txt">实时流</span></button>
      <div class="nav-label">开发</div>
      <button data-href="/" title="项目 / 会话"><span class="txt">项目 / 会话</span></button>
      <button data-href="/" title="自动化规则"><span class="txt">自动化规则</span></button>
      <button data-href="/" title="会话归档"><span class="txt">会话归档</span></button>
      <div class="nav-label">系统</div>
      <button data-href="/" title="智能测试（Test Intelligence）"><span class="txt">智能测试</span></button>
      <button data-href="/" title="审计日志"><span class="txt">审计日志</span></button>
      <button data-href="/" title="Token 管理"><span class="txt">Token 管理</span></button>
      <button data-href="/" title="设置"><span class="txt">设置</span></button>
      <div class="nav-label">文档</div>
      <button data-href="/kb.html" title="知识库"><span class="txt">知识库</span></button>
      <button class="active" data-href="/docgen.html" title="文档生成"><span class="txt">文档生成</span></button>
    </nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">文档生成</h1>
      <span class="plate">starburst-backend</span>
      <select id="themeMode" class="theme-pick" aria-label="外观主题" title="外观主题"></select>
    </header>
    <div class="content">
      
      <div class="kb-wrap">
    <div id="authMsg" class="hint" style="display:none;padding:40px;text-align:center">
      未登录或会话已过期，请先 <a href="/">登录</a>。
    </div>

    <div id="genForm" style="display:none">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select id="docTemplate" class="mono" style="padding:5px 8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);color:var(--fg)" title="内置模板：选中即填充类型与需求描述，可再修改">
          <option value="">内置模板…</option>
        </select>
        <select id="docType" class="mono" style="padding:5px 8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);color:var(--fg)">
          <option value="pptx">PPT (.pptx)</option>
          <option value="docx">Word (.docx)</option>
          <option value="xlsx">Excel (.xlsx)</option>
        </select>
        <select id="docKbCollection" class="mono" style="padding:5px 8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);color:var(--fg)" title="生成后同步进的知识库集合（可选）">
          <option value="">不同步知识库</option>
        </select>
        <input type="text" id="docPrompt" class="mono" style="flex:1;min-width:260px" placeholder="描述文档，如：做一份 6 页立项汇报 PPT，含方案对比表和一张趋势图">
        <label class="hint" style="display:flex;align-items:center;gap:4px;cursor:pointer" title="入队后台渲染（task），可关页面；进度见任务页 / 完成后自动刷新">
          <input type="checkbox" id="docAsync" style="margin:0"> 后台
        </label>
        <button class="primary sm" id="btnGenerate" type="button">生成</button>
      </div>
      <p class="hint" style="margin:6px 0 0">选择集合后产物会自动入库，下次聊天可直接引用自己生成的文档。</p>
    </div>

    <div id="docResults"></div>
    <div id="docHistory" style="margin-top:16px">
    
    </div>
  </div>
</div>

  </div>
</div>
  </div>
</div>
<script src="/assets/docgen.js"></script>
</body>
</html>
