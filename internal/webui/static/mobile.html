<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>StarBurst 移动端</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='.55' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M12 2l2.9 6.26 6.6.57-5 4.4 1.53 6.52L12 16.9 5.97 19.75 7.5 13.23l-5-4.4 6.6-.57z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/style.css?v=__BUILD__">
<link rel="stylesheet" href="/assets/mobile.css?v=__BUILD__">
<script>
/* escapeHtml 必须在 chat.js 之前定义：chat.js 加载时即捕获 global.escapeHtml。 */
window.escapeHtml = function (s) {
  return String(s ?? "").replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
};
/* 主题首帧前落到 <html>，语义与 mobile.js 的 applyTheme 一致。 */
(function () {
  try {
    var mode = localStorage.getItem("sb.theme") || "system";
    var light = window.matchMedia("(prefers-color-scheme: light)").matches;
    document.documentElement.dataset.theme = mode === "system" ? (light ? "light" : "dark") : mode;
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="toast-wrap" id="toastWrap"></div>

<!-- 登录 -->
<div id="loginView" class="m-login">
  <div class="m-login-card">
    <div class="m-brand-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.26 6.6.57-5 4.4 1.53 6.52L12 16.9 5.97 19.75 7.5 13.23l-5-4.4 6.6-.57z"/></svg></div>
    <div class="m-login-brand">StarBurst</div>
    <div class="m-login-sub">移动端 · 会话工作台</div>
    <div class="m-login-field">
      <input type="password" id="pw" placeholder="管理密码" autocomplete="current-password">
    </div>
    <button class="m-login-btn" onclick="doLogin()">登录</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<!-- 会话列表 -->
<div id="listView" class="m-view hidden">
  <header class="m-head">
    <div class="m-head-brand">
      <span class="m-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.26 6.6.57-5 4.4 1.53 6.52L12 16.9 5.97 19.75 7.5 13.23l-5-4.4 6.6-.57z"/></svg></span>
      <span class="m-head-title">StarBurst</span>
    </div>
    <button class="m-icon-btn" id="settingsBtn" title="设置" aria-label="设置">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="m-add-btn" onclick="openNewSheet()" title="新建会话" aria-label="新建会话">＋</button>
  </header>
  <div class="m-search">
    <svg class="m-search-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="filter" placeholder="搜索会话 / 目录…">
  </div>
  <div class="m-filters" id="filters"></div>
  <div class="m-tagfilters" id="tagFilters"></div>
  <div class="m-list" id="list"><div class="wb-placeholder">加载中…</div></div>
</div>

<!-- 聊天页 -->
<div id="chatView" class="m-view hidden">
  <header class="m-head">
    <button class="m-icon-btn" onclick="closePanel()" aria-label="返回">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <span class="dot m-status-dot" id="chatStatusDot" title="状态" style="display:none"></span>
    <span class="m-head-title" id="chatTitle">会话</span>
    <button class="m-icon-btn" id="moreBtn" title="更多" aria-label="更多">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </button>
  </header>
  <div id="shell" class="m-shell"></div>
  <div id="chat" class="wb-chat"></div>
</div>

<!-- 新建会话（底部抽屉） -->
<div id="newSheet" class="m-modal hidden">
  <div class="m-sheet">
    <div class="m-sheet-title">新建会话</div>
    <div class="m-field"><label>工作目录（必填）</label><input id="newDir" list="dirList" placeholder="/path/to/repo"><datalist id="dirList"></datalist></div>
    <div class="m-field"><label>标题（可选）</label><input id="newTitle" placeholder="会话标题"></div>
    <div class="m-sheet-actions">
      <button class="m-primary" onclick="createSession()">创建会话</button>
      <button class="ghost" onclick="closeNewSheet()">取消</button>
    </div>
    <div id="newMsg" class="msg"></div>
  </div>
</div>

<!-- 设置（底部抽屉） -->
<div id="settingsModal" class="m-modal hidden">
  <div class="m-sheet">
    <div class="m-sheet-title">设置</div>
    <div class="m-field"><label>外观主题</label><select id="themeMode"></select></div>
    <div class="m-field"><label>APP Token（可选，用于语音输入）</label><input type="text" id="appToken" placeholder="粘贴 APP Token"></div>
    <div class="m-sheet-actions"><button class="m-primary" onclick="saveAppToken()">保存 Token</button></div>
    <hr>
    <button class="m-sheet-danger" onclick="doLogout()">退出登录</button>
  </div>
</div>

<!-- 通用弹窗（上下文占用详情 / 标签编辑） -->
<div id="modal" class="m-modal hidden">
  <div class="m-modal-card">
    <div class="m-modal-head"><span id="modalTitle"></span><button class="m-close" onclick="modalClose()">×</button></div>
    <div class="m-modal-body" id="modalBody"></div>
  </div>
</div>

<!-- 更多操作底部抽屉 -->
<div id="moreSheet" class="m-modal hidden">
  <div class="m-sheet">
    <div class="m-sheet-title" id="moreSheetTitle">会话操作</div>
    <div id="moreSheetBody"></div>
    <button class="ghost" onclick="moreSheetClose()">取消</button>
  </div>
</div>

<script src="/assets/chat.js?v=__BUILD__"></script>
<script src="/assets/mobile.js?v=__BUILD__"></script>
</body>
</html>
