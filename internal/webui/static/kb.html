<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库管理</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  body { padding: 0; }
  .kb-top { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line);
           background: var(--bg); position:sticky; top:0; z-index:5; }
  .kb-top h1 { font-size:16px; margin:0; }
  .kb-top .spacer { flex:1; }
  .kb-wrap { max-width:960px; margin:0 auto; padding:20px; }
  .kb-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .kb-card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px; }
  .kb-card h3 { margin:0 0 4px; font-size:14px; }
  .kb-card .desc { color:var(--muted); font-size:12px; margin:0 0 8px; }
  .kb-card .stat { font-size:12px; color:var(--muted); }
  .kb-card .ops { display:flex; gap:8px; margin-top:10px; }
  .kb-row { display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line); }
  .kb-row:last-child { border-bottom:none; }
  .kb-row .name { flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kb-row .meta { color:var(--muted); font-size:12px; }
  .chip { font-size:11px; padding:1px 7px; border-radius:999px; background:var(--surface-2); color:var(--muted); }
  .kb-search-result { border:1px solid var(--line); border-radius:var(--r-md); padding:10px 12px; margin-top:8px; }
  .kb-search-result .src { font-size:12px; color:var(--accent); font-weight:600; }
  .kb-search-result .body { font-size:13px; margin:4px 0 0; white-space:pre-wrap; }
  .hint { color:var(--muted); font-size:12px; }
  #fileInput { display:none; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
  <div class="kb-top">
    <button class="ghost sm" id="btnHome" type="button">← 返回工作台</button>
    <h1>知识库管理</h1>
    <span class="chip">团队文档 → 向量检索 → RAG-in-Prompt 自动带入会话</span>
    <span class="spacer"></span>
    <button class="primary sm" id="btnNewCollection" type="button">新建集合</button>
  </div>

  <div class="kb-wrap">
    <div id="authMsg" class="hint" style="display:none;padding:40px;text-align:center">
      未登录或会话已过期，请先 <a href="/">登录</a>。
    </div>
    <div id="collections"></div>

    <div id="detail" style="display:none">
      <div style="display:flex;align-items:center;gap:10px;margin:18px 0 10px">
        <button class="ghost sm" id="btnBack" type="button">← 返回集合</button>
        <h2 id="detailTitle" style="font-size:15px;margin:0"></h2>
        <span class="spacer" style="flex:1"></span>
        <button class="primary sm" id="btnUpload" type="button">上传文档</button>
        <input type="file" id="fileInput">
      </div>
      <div id="documents"></div>
    </div>

    <div id="searchSec" style="margin-top:22px">
      <h2 style="font-size:14px;margin:0 0 8px">检索测试</h2>
      <div style="display:flex;gap:8px">
        <select id="searchCollection" class="mono" style="padding:5px 8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);color:var(--fg)" title="限定检索范围（默认全库）">
          <option value="">全部集合</option>
        </select>
        <input type="text" id="searchQ" class="mono" style="flex:1" placeholder="输入问题，验证知识库命中（如：安全库存规则是什么？）">
        <button class="primary sm" id="btnSearch" type="button">检索</button>
      </div>
      <div id="searchResults"></div>
      <div id="ragStats" style="margin-top:16px">
        <h3 style="font-size:13px;margin:0 0 6px">RAG-in-Prompt 命中统计（会话自动带入知识库的结局分布）</h3>
        <div id="ragStatsBody" class="hint" style="line-height:1.8">加载中…</div>
      </div>
    </div>

  </div>

  <script src="/assets/kb.js"></script>
</body>
</html>
