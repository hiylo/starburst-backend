name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./internal/...
      - name: Build
        run: go build ./...

  # PostgreSQL is an optional backend. The pgtest-tagged tests build their own
  # scratch database inside the service container and drop it afterwards.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test PostgreSQL dialect
        env:
          OCB_PG_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -tags pgtest -run Postgres -v ./internal/store/

  # install.sh 在沙箱前缀下真实跑一遍：不装到系统，但验证参数解析、下载、目录
  # 与 unit 生成。占位符断言防住 DSN 含 & 时被 ${var//pat/rep} 写坏的回归。
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Shell syntax check
        run: bash -n scripts/install.sh
      - name: Build local binary
        run: go build -o ./opencode-backend ./cmd/opencode-backend
      - name: Sandbox install with special-character DSN
        run: |
          sandbox="$RUNNER_TEMP/sandbox"
          OCB_BIN_URL="file://$(pwd)/opencode-backend" \
            bash scripts/install.sh --prefix "$sandbox" --port 18080 \
              --db postgres --workers 2 \
              --pg-dsn 'postgres://user:p@ss@127.0.0.1:5432/db?sslmode=disable&application_name=a"b\c' \
              --admin-password 'ad$min `x` !'
      - name: Verify generated unit and binary
        run: |
          sandbox="$RUNNER_TEMP/sandbox"
          test -x "$sandbox/usr/local/bin/opencode-backend"
          "$sandbox/usr/local/bin/opencode-backend" --version
          grep -F 'sslmode=disable&application_name' "$sandbox/etc/systemd/system/opencode-backend.service"
          ! grep -E '@(BIN_PATH|PORT|EXEC_QUOTED_ARGS|OPENCODE_URL|DATA_DIR)@' "$sandbox/etc/systemd/system/opencode-backend.service"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, postgres, install-script]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: linux
            arch: arm
            goarm: '7'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          name="opencode-backend-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then name="$name.exe"; fi
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/hiylo/opencode-backend/internal/config.Version=${GITHUB_REF_NAME}" \
            -o "dist/$name" ./cmd/opencode-backend
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-backend-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/opencode-backend-${{ matrix.os }}-${{ matrix.arch }}*

  # 合并各平台产物并创建 GitHub Release。install.sh 从 releases/latest/download/
  # 下载二进制，只有 Release 附件能满足，上传 artifact 本身不够。
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ls -l dist
          gh release create "$tag" dist/* \
            --verify-tag \
            --title "$tag" \
            --notes "opencode-backend $tag"