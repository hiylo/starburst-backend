name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./internal/...
      - name: Build
        run: go build ./...

  # PostgreSQL 是可选后端，但生产推荐形态（RAG 向量检索）恰好只有它有：
  # internal/store/rag.go 的 PGVectorInstalled 在非 PG 上无条件返回 false。
  # 所以这里必须真的跑起来，而不是留一个静默 skip 的绿勾。
  # 镜像必须带 pgvector：migrate.go 的 intel_rag 迁移会 CREATE EXTENSION vector，
  # 裸 postgres:16 会在这里直接失败。
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          # 仅存活于本次 job 的容器内临时口令，不是任何真实凭据。
          POSTGRES_PASSWORD: pgtest-ci-only
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # openScratchStore（internal/store/postgres_test.go）自己 CREATE/DROP
      # DATABASE ocb_test_<pid>_<n> 并在临时库里跑迁移，所以连接角色需要 CREATEDB；
      # 这里用同样的流程预跑一遍，让权限不足或镜像缺 vector 在几十秒内就报错，
      # 而不是埋在测试日志里。
      - name: Preflight scratch database
        env:
          PGPASSWORD: pgtest-ci-only
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE ocb_ci_preflight;
          \c ocb_ci_preflight
          CREATE EXTENSION IF NOT EXISTS vector;
          SELECT extversion FROM pg_extension WHERE extname = 'vector';
          \c postgres
          DROP DATABASE ocb_ci_preflight;
          SQL
      - name: Test PostgreSQL dialect
        env:
          STARBURST_PG_DSN: postgres://postgres:pgtest-ci-only@localhost:5432/postgres?sslmode=disable
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/pgtest.log"
          go test -tags pgtest -race -run Postgres -v ./internal/store/ 2>&1 | tee "$log"
          # 两个 pgtest 文件（postgres_test.go / rag_pg_test.go）都靠读不到
          # STARBURST_PG_DSN 或 tag 漏写而整体 skip，此时 job 依然是绿的。显式拒绝。
          if grep -qE -- '--- SKIP|no tests to run' "$log"; then
            echo '::error::pgtest 用例被跳过，检查 STARBURST_PG_DSN 与 -tags pgtest'
            exit 1
          fi

  # install.sh 在沙箱前缀下真实跑一遍：不装到系统，但验证参数解析、下载、目录
  # 与 unit 生成。占位符断言防住 DSN 含 & 时被 ${var//pat/rep} 写坏的回归。
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Shell syntax check
        run: bash -n scripts/install.sh
      - name: Build local binary
        run: go build -o ./starburst-backend ./cmd/starburst-backend
      - name: Sandbox install with special-character DSN
        run: |
          sandbox="$RUNNER_TEMP/sandbox"
          STARBURST_BIN_URL="file://$(pwd)/starburst-backend" \
            bash scripts/install.sh --prefix "$sandbox" --port 18080 \
              --db postgres --workers 2 \
              --pg-dsn 'postgres://user:p@ss@127.0.0.1:5432/db?sslmode=disable&application_name=a"b\c' \
              --admin-password 'ad$min `x` !'
      - name: Verify generated unit and binary
        run: |
          sandbox="$RUNNER_TEMP/sandbox"
          test -x "$sandbox/usr/local/bin/starburst-backend"
          "$sandbox/usr/local/bin/starburst-backend" --version
          grep -F 'sslmode=disable&application_name' "$sandbox/etc/systemd/system/starburst-backend.service"
          ! grep -E '@(BIN_PATH|PORT|EXEC_QUOTED_ARGS|OPENCODE_URL|DATA_DIR)@' "$sandbox/etc/systemd/system/starburst-backend.service"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, postgres, install-script]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: linux
            arch: arm
            goarm: '7'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          name="starburst-backend-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then name="$name.exe"; fi
          mkdir -p dist
          # 剥离 tag 的 v 前缀，使 --version / /api/system 的 version 与 config.Version
          # 默认值同为纯语义化版本（2.0.0 而非 v2.0.0），与客户端 compareVersions 格式一致。
          version="${GITHUB_REF_NAME#v}"
          echo "building $name with Version=$version"
          go build -trimpath \
            -ldflags "-s -w -X github.com/hiylo/starburst-backend/internal/config.Version=$version" \
            -o "dist/$name" ./cmd/starburst-backend
      - uses: actions/upload-artifact@v4
        with:
          name: starburst-backend-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/starburst-backend-${{ matrix.os }}-${{ matrix.arch }}*

  # 合并各平台产物并创建 GitHub Release。install.sh 从 releases/latest/download/
  # 下载二进制，只有 Release 附件能满足，上传 artifact 本身不够。
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ls -l dist
          gh release create "$tag" dist/* \
            --verify-tag \
            --title "$tag" \
            --notes "starburst-backend $tag"